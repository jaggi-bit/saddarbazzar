spring:
  application:
    name: sadar-bazar-api

  profiles:
    active: dev

  # Email (Mailtrap sandbox for testing, swap for production SMTP)
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:1671970da42303}
    password: ${MAIL_PASSWORD:dc97480978fb74}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  # Disable Thymeleaf auto-resolution for web views (we only use it for emails)
  thymeleaf:
    check-template-location: false

server:
  port: 8080
  servlet:
    context-path: /api/v1

# Common settings
app:
  jwt:
    secret: ${JWT_SECRET:my-super-secret-dev-key-that-is-at-least-256-bits-long-for-hs256}
    expiration-ms: 86400000  # 24 hours
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  cart:
    expiry-days: 7
  inventory-lock:
    ttl-minutes: 15
  payment:
    gateway-name: ${PAYMENT_GATEWAY_NAME:ONLINE}
    api-key: ${PAYMENT_API_KEY:}
    secret-key: ${PAYMENT_SECRET_KEY:}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
    sandbox: ${PAYMENT_SANDBOX:true}
  health:
    payment-ping-url: ${HEALTH_PAYMENT_PING_URL:}
    logistics-ping-url: ${HEALTH_LOGISTICS_PING_URL:}
  mail:
    from: ${MAIL_FROM:noreply@sadarbazar.pk}
    admin-email: ${ADMIN_EMAIL:admin@sadarbazar.pk}
    enabled: ${MAIL_ENABLED:true}

# PostEx Logistics
logistics:
  postex:
    token: ${POSTEX_API_TOKEN:}
    url: ${POSTEX_BASE_URL:https://api.postex.pk/services/integration/api}
